name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar JDK 17 y caché de Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3. Permisos de ejecución al wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # 4. Crear .env vacío para evitar fallos del plugin Secrets Gradle
      - name: Create empty .env file
        run: touch .env

      # 5. Generar clave de firma y configurar build.gradle si es necesario
      - name: Generate signing key and configure release signing
        run: |
          set -e
          # 5.1 Generar keystore autofirmado si no existe
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Release, OU=Dev, O=App, L=City, S=State, C=US"
          fi

          # 5.2 Añadir signingConfigs.release a app/build.gradle si no está presente
          if [ -f app/build.gradle ] && ! grep -q "signingConfigs {" app/build.gradle; then
            # Insertar bloque de firma antes de la primera línea que contenga "buildTypes"
            python3 - <<'PY'
import re
path = 'app/build.gradle'
with open(path, 'r') as f:
    content = f.read()
block = '''
    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'android'
            keyAlias 'release'
            keyPassword 'android'
        }
    }
'''
if 'buildTypes' in content:
    content = content.replace('buildTypes', block + '\n    buildTypes', 1)
else:
    content += '\n' + block
with open(path, 'w') as f:
    f.write(content)
PY
          fi
        shell: bash

      # 6. Compilar APK Release
      - name: Build Release APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi
        shell: bash

      # 7. Subir artefacto APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
